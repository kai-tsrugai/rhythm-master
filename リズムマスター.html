<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>リズムマスター</title>
<style>
:root{--bg:#1a110a;--gold:#f3c969;--cream:#fff4dc;--wine:#7a1f2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;color:var(--cream)}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:450px;height:800px;transform-origin:center center;flex:none;overflow:hidden;background:#000}
canvas{position:absolute;inset:0;width:450px;height:800px}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:rgba(20,10,4,.55)}
.scr.on{display:flex}
h1{font-size:46px;margin:0;color:var(--gold);letter-spacing:4px;text-shadow:0 3px 12px #000,0 0 24px rgba(243,201,105,.5)}
h2{font-size:26px;margin:0 0 6px;color:var(--gold);letter-spacing:2px}
.sub{font-size:13px;letter-spacing:5px;opacity:.85}
button{font:inherit;font-size:20px;color:var(--cream);background:linear-gradient(#9b2a3a,var(--wine));border:2px solid var(--gold);border-radius:14px;padding:13px 0;width:270px;box-shadow:0 4px 14px rgba(0,0,0,.6);cursor:pointer}
button:active{transform:scale(.97)}
button small{display:block;font-size:12px;opacity:.85;margin-top:2px}
button.ghost{background:rgba(0,0,0,.45);font-size:16px;padding:10px 0}
.rank{font-size:96px;line-height:1;font-weight:bold;color:var(--gold);text-shadow:0 0 24px rgba(243,201,105,.7)}
.tbl{width:270px;font-size:17px;background:rgba(0,0,0,.45);border:1px solid var(--gold);border-radius:12px;padding:10px 16px;box-sizing:border-box}
.tbl div{display:flex;justify-content:space-between;padding:3px 0}
#pbtn{position:absolute;right:12px;bottom:12px;width:48px;height:48px;padding:0;font-size:20px;border-radius:50%;display:none;opacity:.85;z-index:5}
#best{font-size:13px;opacity:.85}
#tBody{width:310px;font-size:15px;line-height:1.7;background:rgba(0,0,0,.5);border:1px solid var(--gold);border-radius:12px;padding:14px 16px;box-sizing:border-box;min-height:250px;text-align:left}
#tBody p{margin:6px 0}
.chips{display:flex;justify-content:center;gap:10px;margin:10px 0}
.chip{background:var(--cream);border-radius:10px;padding:5px 6px;text-align:center;color:#2a1a0e;font-size:11px}
.chip img{height:58px;display:block;margin:0 auto 2px}
.row{display:flex;gap:10px}
.row button{width:130px}
#tDots{letter-spacing:4px;color:var(--gold)}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<canvas id="cv" width="900" height="1600"></canvas>
<div class="scr on" id="home">
  <div class="sub">SNARE DRUM RHYTHM GAME</div>
  <h1>リズムマスター</h1>
  <div style="height:150px"></div>
  <button id="bStart">ゲームスタート</button>
  <button class="ghost" id="bTut">あそびかた（チュートリアル）</button>
  <div class="sub" style="font-size:11px;letter-spacing:2px;opacity:.7">画面のどこをタップしてもOK</div>
</div>
<div class="scr" id="select">
  <h2>難易度を選択</h2>
  <button data-d="easy">初級 EASY<small>BPM 90 ・ 4分音符 / 8分音符</small></button>
  <button data-d="normal">中級 NORMAL<small>BPM 120 ・ 16分音符 / 休符</small></button>
  <button data-d="hard">上級 HARD<small>BPM 145 ・ 16分音符の複合 / 細かな休符</small></button>
  <button data-d="expert">超上級 EXPERT<small>BPM 160 ・ 1501ノーツ</small></button>
  <button data-d="master">MASTER<small>BPM 200 ・ 1722ノーツ</small></button>
  <div class="row" style="align-items:center"><button class="ghost" id="spM" style="width:48px">−</button><div id="spV" style="width:170px;font-size:14px"></div><button class="ghost" id="spP" style="width:48px">＋</button></div>
  <button class="ghost" id="bBack">ホームへ戻る</button>
</div>
<button id="pbtn" aria-label="一時停止">⏸</button>
<div class="scr" id="tut">
  <h2 id="tTitle"></h2>
  <div id="tBody"></div>
  <div id="tDots"></div>
  <div class="row"><button class="ghost" id="tPrev">前へ</button><button id="tNext">次へ</button><button id="tPlay">練習プレイ</button></div>
  <button class="ghost" id="tClose">閉じる</button>
</div>
<div class="scr" id="pause">
  <h2>一時停止</h2>
  <button id="bResume">再開</button>
  <button id="bRestart">リスタート</button>
  <button class="ghost" id="bSel2">難易度選択へ</button>
  <button class="ghost" id="bHome2">ホームへ戻る</button>
</div>
<div class="scr" id="result">
  <h2 id="rTitle">RESULT</h2>
  <div id="rClear" style="font-size:26px;letter-spacing:4px;font-weight:bold"></div>
  <div class="rank" id="rRank">S</div>
  <div class="tbl">
    <div><span>達成率</span><b id="rRate">0%</b></div>
    <div><span>スコア</span><b id="rScore">0</b></div>
    <div><span>最大コンボ</span><b id="rCombo">0</b></div>
    <div><span>PERFECT</span><b id="rP">0</b></div>
    <div><span>GREAT</span><b id="rG">0</b></div>
    <div><span>MISS</span><b id="rM">0</b></div>
  </div>
  <div id="best"></div>
  <button id="bRetry">もう一度プレイ</button>
  <button class="ghost" id="bSel">難易度選択へ</button>
  <button class="ghost" id="bHome">ホームへ戻る</button>
</div>
</div></div>

let ac=null,hitBuf=null;
function initAudio(){if(ac){if(ac.state==='suspended')ac.resume();return}
 try{ac=new (window.AudioContext||window.webkitAudioContext)();
 fetch(SND).then(r=>r.arrayBuffer()).then(b=>ac.decodeAudioData(b)).then(d=>{hitBuf=d}).catch(()=>{});}catch(e){ac=null}}

// chart
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
function build(d){const r=rng(d.length*977+DIFF[d].bpm),P=PAT[d],GL=GOAL[d],out=[];let beat=0,last=null,cnt=0,m=0;
 const add=p=>{for(const t of p){const rest=t[0]==='r';out.push({t,beat:beat+LEAD,rest,done:false});beat+=DUR[t];if(!rest)cnt++}};
 const nn=p=>p.filter(t=>t[0]!=='r').length;
 add(['q','q','q','q']);m++;
 while(cnt<GL-4){let p;
  if(d!=='easy'&&m%24===23)p=['rw'];
  else{const pool=m<4?E1.slice(0,5):P;let i;do{i=Math.floor(r()*pool.length)}while(pool[i]===last&&pool.length>1);p=pool[i];last=p}
  if(cnt+nn(p)>GL-4){while(cnt<GL-4)add(['e']);break}
  add(p);m++}
 add(['q','q','q','q']);
 return {notes:out,total:cnt,beats:beat}}

let cur='easy',G=null,tapAnim=-9999,flash=null,judgeTxt=null,beepK=-1;
const now=()=>performance.now();
function start(d){cur=d;const D=DIFF[d],c=build(d);PW=D.pw;GW=D.gw;
 G={d,bpm:D.bpm,bm:60000/D.bpm,notes:c.notes,total:c.total,end:(c.beats+LEAD)*60000/D.bpm+1500,score:0,combo:0,max:0,P:0,Gr:0,M:0,t0:now()};
 beepK=-1;judgeTxt=null;flash=null;show('play')}
function judge(j,n){n.done=true;
 if(j==='M'){G.M++;G.combo=0}
 else{G[j==='P'?'P':'Gr']++;G.combo++;G.max=Math.max(G.max,G.combo);G.score+=(j==='P'?1000:600)+Math.min(G.combo,50)*10}
 judgeTxt={j,t:now()};if(j!=='M')flash={t:now(),j}}
function tap(){if(state!=='play'||!G)return;tapAnim=now();hitSound();
 const t=now()-G.t0;let best=null,bd=1e9;
 for(const n of G.notes){if(n.done||n.rest)continue;const dt=Math.abs(n.beat*G.bm-t);if(dt<bd){bd=dt;best=n}if(n.beat*G.bm-t>GW*2)break}
 if(best&&bd<=GW){judge(bd<=PW?'P':'G',best);return}
 for(const n of G.notes){if(!n.rest||n.done)continue;if(Math.abs(n.beat*G.bm-t)<=GW*.8){judge('M',n);return}}}
addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('button'))return;if(state==='play'){e.preventDefault();tap()}},{passive:false});

 $('rTitle').textContent='RESULT ・ '+DIFF[G.d].name;{const rate=acc*100,ok=rate>=DIFF[G.d].cl;$('rClear').textContent=(ok?'CLEAR！':'FAILED')+'　/ LINE '+DIFF[G.d].cl+'%';$('rClear').style.color=ok?'#6be38a':'#ff6b6b';$('rRate').textContent=rate.toFixed(1)+'%';}$('rRank').textContent=rk;$('rScore').textContent=G.score;$('rCombo').textContent=G.max;$('rP').textContent=G.P;$('rG').textContent=G.Gr;$('rM').textContent=G.M;
 let b=0;try{const k='rm_best_'+G.d;b=+localStorage.getItem(k)||0;if(G.score>b){localStorage.setItem(k,G.score);$('best').textContent='NEW RECORD！'}else $('best').textContent='ベストスコア '+b}catch(e){$('best').textContent=''}

 cx.fillStyle='rgba(10,5,2,.35)';cx.fillRect(0,0,W,H)}
function noteDraw(n,x){const k=n.t;
 if(k==='rw'){const i=IMG.rw,w=52,h=i?w*i.height/i.width:14;draw(i,x,SM-SP*1.5-h-0+SP*0.0+SP*1.0,w,h,(a,b,c,d)=>cx.fillRect(a,b,c,d));return}
 const h=82,w=h*130/160,i=IMG[k];
 if(n.rest){draw(i,x-w/2,SM-h/2-8,w,h,(a,b,c,d)=>{cx.fillRect(a+c/3,b+d/3,c/3,d/3)});return}
 draw(i,x-w*.38,SM+SP-h*.81,w,h,(a,b,c,d)=>{cx.beginPath();cx.ellipse(a+c*.38,SM+SP,7,5,-.4,0,7);cx.fill();cx.fillRect(a+c*.38+7,b,2,d*.8)})}
function frame(){requestAnimationFrame(frame);cx.clearRect(0,0,W,H);bgDraw();
 const t=G?(state==='pause'?G.pt:now()-G.t0):0;
 // staff band
 cx.fillStyle='rgba(255,246,225,.9)';cx.beginPath();cx.roundRect(0,SM-SP*2-34,W,SP*4+68,0);cx.fill();
 cx.strokeStyle='#2a1a0e';cx.lineWidth=1.5;for(let i=-2;i<=2;i++){cx.beginPath();cx.moveTo(0,SM+i*SP);cx.lineTo(W,SM+i*SP);cx.stroke()}
 // judge line
 cx.strokeStyle='rgba(122,31,43,.85)';cx.lineWidth=3;cx.beginPath();cx.moveTo(JX,SM-SP*2-24);cx.lineTo(JX,SM+SP*2+24);cx.stroke();
 if(flash){const a=1-(now()-flash.t)/250;if(a>0){cx.fillStyle=(flash.j==='P'?'rgba(255,214,90,':'rgba(120,200,255,')+(a*.55)+')';cx.beginPath();cx.arc(JX,SM,14+(1-a)*30,0,7);cx.fill()}}
 // notes
 if(G){
  for(const n of G.notes){const x=JX+(n.beat*G.bm-t)/G.bm*PPB;
   if(!n.done&&!n.rest&&t>n.beat*G.bm+GW)judge('M',n);
   if(x<-60||x>W+60)continue;if(n.done&&!n.rest)continue;
   if(n.done&&n.rest)cx.globalAlpha=.3;noteDraw(n,x);cx.globalAlpha=1}
  // count-in
  const bk=Math.floor(t/G.bm);if(t>=0&&bk<LEAD&&bk>beepK){beepK=bk;beep(bk===LEAD-1?880:660,.08)}
  if(t<LEAD*G.bm){cx.fillStyle='rgba(255,244,220,.95)';cx.font='bold 90px Georgia,serif';cx.textAlign='center';cx.fillText(Math.max(1,LEAD-Math.max(0,bk)),W/2,215)}
  // hud
  cx.textAlign='left';cx.fillStyle='#fff4dc';cx.font='bold 22px Georgia,serif';cx.fillText(String(G.score).padStart(7,'0'),18,44);
  cx.textAlign='right';cx.font='13px Georgia,serif';cx.fillText(DIFF[G.d].name+' ・ BPM '+G.bpm,W-18,40);
  cx.fillStyle='rgba(0,0,0,.45)';cx.fillRect(18,58,W-36,5);cx.fillStyle='#f3c969';cx.fillRect(18,58,(W-36)*Math.min(1,Math.max(0,t/G.end)),5);
  {const gv=G.total?(G.P+G.Gr*.6)/G.total*100:0,cl=DIFF[G.d].cl,gx=18+(W-36)*cl/100;cx.fillStyle='rgba(0,0,0,.45)';cx.fillRect(18,70,W-36,8);cx.fillStyle=gv>=cl?'#6be38a':'#7cc8ff';cx.fillRect(18,70,(W-36)*gv/100,8);cx.fillStyle='#fff';cx.fillRect(gx-1,66,2,16);cx.textAlign='left';cx.font='11px sans-serif';cx.fillStyle='rgba(255,244,220,.9)';cx.fillText('CLEAR LINE '+cl+'%　達成率 '+gv.toFixed(1)+'%',18,96)}
  if(G.combo>1){cx.textAlign='center';cx.fillStyle='#fff4dc';cx.shadowColor='#000';cx.shadowBlur=8;cx.font='bold 54px Georgia,serif';cx.fillText(G.combo,W/2,640);cx.font='16px Georgia,serif';cx.fillText('COMBO',W/2,664);cx.shadowBlur=0}
  if(judgeTxt){const a=1-(now()-judgeTxt.t)/600;if(a>0){cx.globalAlpha=a;cx.textAlign='center';cx.font='bold 30px Georgia,serif';const J=judgeTxt.j;cx.fillStyle=J==='P'?'#ffd65a':J==='G'?'#7cc8ff':'#ff6b6b';cx.shadowColor='#000';cx.shadowBlur=6;cx.fillText(J==='P'?'PERFECT':J==='G'?'GREAT':'MISS',W/2,SM-SP*2-52);cx.shadowBlur=0;cx.globalAlpha=1}}
  cx.textAlign='center';cx.fillStyle='rgba(255,244,220,.7)';cx.font='14px sans-serif';cx.fillText('画面をタップ',W/2,770);
  if(t>G.end)finish();
 }
 // snare (always visible during play)
 if(state==='play'||state==='pause'){
  const i=IMG.snare,w=112,h=i?w*i.height/i.width:100,k=Math.max(0,1-(now()-tapAnim)/140),sc=1-.1*k,dy=8*k;
  cx.save();cx.translate(JX-58,SM+dy);cx.scale(sc,sc);
  if(i)cx.drawImage(i,-w/2,-h/2,w,h);else{cx.fillStyle='#8a5a2b';cx.fillRect(-w/2,-30,w,60)}
  cx.restore()}
}
frame();
</script>
